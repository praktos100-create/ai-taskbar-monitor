name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python build_windows.py
      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}
          path: dist/AITaskbarMonitor-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "AI Taskbar Monitor $TAG" \
            --notes 'Download and extract the Windows ZIP for your CPU, then run AITaskbarMonitor.exe. Python is bundled.' \
            *.zip SHA256SUMS.txt
